name: Deploy to GitHub Pages

# Builds the serverless frontend and publishes it. No College Board content is
# ever built into the bundle: the site fetches the question bank from College
# Board in the browser at runtime and caches it in IndexedDB. What ships here is
# code only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy half way; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # The port to TypeScript is what makes the static build possible, and the
      # rationale parser is the risky part of it. Do not deploy a red suite.
      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        env:
          # Vite needs a base path or every asset 404s. This deploys to
          # satbluebank.com, which serves from the root; a fork without a custom
          # domain wants BASE: /${{ github.event.repository.name }}/ instead.
          BASE: /
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
